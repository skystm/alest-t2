<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador Help Desk</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f5f7; color: #20252b; font: 15px Arial, sans-serif; }
    main { max-width: 1000px; margin: 28px auto; padding: 0 20px; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    p { margin: 0 0 20px; color: #59636e; }
    .controls { display: grid; grid-template-columns: repeat(6, minmax(100px, 1fr)); gap: 10px; }
    label { display: grid; gap: 5px; font-size: 13px; color: #454d55; }
    input, button { min-width: 0; padding: 9px; border: 1px solid #bbc3ca; border-radius: 4px; background: white; color: inherit; font: inherit; }
    .actions { display: flex; gap: 8px; margin: 12px 0; }
    button { cursor: pointer; border-color: #145da0; background: #1769aa; color: white; }
    button.secondary { background: white; color: #145da0; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 20px; margin: 10px 0; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 9px 10px; border: 1px solid #d5dbe0; text-align: left; }
    th { width: 35%; background: #edf0f2; font-weight: 600; }
    h2 { margin: 22px 0 8px; font-size: 18px; }
    .chart { height: 250px; border: 1px solid #d5dbe0; background: white; }
    canvas { width: 100%; height: 100%; }
    details { margin-top: 12px; }
    pre { max-height: 300px; overflow: auto; padding: 12px; background: #20252b; color: white; font: 12px Consolas, monospace; white-space: pre-wrap; }
    @media (max-width: 720px) {
      .controls { grid-template-columns: repeat(2, 1fr); }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Simulador de Help Desk</h1>
    <p>Configure os recursos e execute a simulação. A mesma semente reproduz o mesmo resultado.</p>

    <section class="controls">
      <label>Semente <input id="seed" type="number" value="42"></label>
      <label>Rodadas <input id="rodadas" type="number" min="1" max="1000" value="100"></label>
      <label>Atendentes <input id="atendentes" type="number" min="1" max="100" value="3"></label>
      <label>Classificadores <input id="classificadores" type="number" min="1" max="100" value="2"></label>
      <label>Capacidade da fila <input id="capacidade" type="number" min="1" max="100000" value="20"></label>
      <label>Chegadas máx./rodada <input id="maxchegada" type="number" min="0" max="100000" value="3"></label>
    </section>

    <div class="actions">
      <button id="run" type="button">Executar cenário configurado</button>
      <button id="run4" class="secondary" type="button">Comparar com 4 classificadores</button>
    </div>
    <div id="status" role="status">Pronto.</div>

    <table aria-label="Resumo da simulação">
      <tbody>
        <tr><th>Chamados que chegaram</th><td id="chegaram">—</td></tr>
        <tr><th>Recusados</th><td id="recusados">—</td></tr>
        <tr><th>Classificados</th><td id="classificados">—</td></tr>
        <tr><th>Concluídos</th><td id="concluidos">—</td></tr>
        <tr><th>Espera média na entrada</th><td id="espera">—</td></tr>
        <tr><th>Ocupação dos atendentes</th><td id="ocupacao">—</td></tr>
      </tbody>
    </table>

    <h2>Fila de entrada por rodada</h2>
    <div class="chart"><canvas id="chart" aria-label="Gráfico do tamanho da fila de entrada"></canvas></div>
    <details>
      <summary>Log detalhado da execução</summary>
      <pre id="output"></pre>
    </details>
  </main>

  <script>
    const fields = ["seed", "rodadas", "atendentes", "classificadores", "capacidade", "maxchegada"];
    const buttons = [document.getElementById("run"), document.getElementById("run4")];

    async function runSimulation(useFourClassifiers) {
      if (useFourClassifiers) document.getElementById("classificadores").value = "4";
      const params = new URLSearchParams();
      fields.forEach(name => params.set(name, document.getElementById(name).value));
      buttons.forEach(button => button.disabled = true);
      document.getElementById("status").textContent = "Executando...";

      try {
        const response = await fetch("/api/run?" + params.toString());
        const data = await response.json();
        if (!response.ok) throw new Error(data.output || "Falha na simulação");

        const summary = data.summary;
        document.getElementById("chegaram").textContent = summary.chegaram;
        document.getElementById("recusados").textContent =
          summary.recusados + " (" + summary.recusadosPercent.replace(/%+$/, "") + "%)";
        document.getElementById("classificados").textContent = summary.classificados;
        document.getElementById("concluidos").textContent = summary.concluidos;
        document.getElementById("espera").textContent = summary.esperaEntrada + " rodadas";
        document.getElementById("ocupacao").textContent = summary.ocupacao + "%";
        document.getElementById("output").textContent = data.output;
        drawChart(data.history);
        document.getElementById("status").textContent =
          "Cenário executado: " + data.seed + " (semente), " + params.get("classificadores") + " classificadores.";
      } catch (error) {
        document.getElementById("status").textContent = "Erro: " + error.message;
      } finally {
        buttons.forEach(button => button.disabled = false);
      }
    }

    function drawChart(history) {
      const canvas = document.getElementById("chart");
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;
      const ctx = canvas.getContext("2d");
      ctx.scale(ratio, ratio);
      ctx.clearRect(0, 0, rect.width, rect.height);
      if (!history || history.length === 0) return;

      const left = 48, right = rect.width - 16, top = 16, bottom = rect.height - 30;
      const max = Math.max(1, ...history.map(row => row.filaEntrada));
      ctx.font = "12px Arial";
      ctx.fillStyle = "#454d55";
      ctx.strokeStyle = "#d5dbe0";
      ctx.textAlign = "right";
      for (let tick = 0; tick <= 4; tick++) {
        const y = top + (bottom - top) * tick / 4;
        ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
        ctx.fillText(String(Math.round(max * (4 - tick) / 4)), left - 7, y + 4);
      }

      ctx.beginPath();
      history.forEach((row, index) => {
        const x = left + (right - left) * index / Math.max(1, history.length - 1);
        const y = bottom - (bottom - top) * row.filaEntrada / max;
        if (index === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = "#1769aa";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.textAlign = "center";
      ctx.fillText("Rodada", (left + right) / 2, rect.height - 6);
    }

    document.getElementById("run").addEventListener("click", () => runSimulation(false));
    document.getElementById("run4").addEventListener("click", () => runSimulation(true));
  </script>
</body>
</html>
